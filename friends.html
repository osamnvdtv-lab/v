  </style>

<script>

/* =====================================================
   SUPABASE
===================================================== */

const SUPABASE_URL =
  "https://uxeflbmxngnaygrvrsbe.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_wKRwXTeO5ZeBKIQ7EbW5Xw_ockmVLNq";

const db =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


/* =====================================================
   GLOBAL
===================================================== */

let me = null;

let allProfiles = [];

let followingIds = new Set();

let currentFriendTab = "friends";

let currentMainTab = "friends";

let allStories = [];

let currentStoryIndex = 0;


/* =====================================================
   HELPERS
===================================================== */

function showToast(message) {

  const toast =
    document.getElementById("toast");

  toast.textContent = message;

  toast.classList.add("show");

  setTimeout(() => {

    toast.classList.remove("show");

  }, 2200);

}


function escapeHtml(text) {

  if (!text) return "";

  return String(text)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}


function avatar(url) {

  if (url) return url;

  return "https://ui-avatars.com/api/?name=VIBEX&background=222&color=fff";
}


/* =====================================================
   INIT
===================================================== */

async function init() {

  const {
    data: {
      session
    }
  } = await db.auth.getSession();

  if (!session) {

    window.location.href =
      "./login.html";

    return;
  }

  me = session.user;

  await loadFollowing();

  await loadProfiles();

  await loadStories();

  await loadConversations();

  renderUsers();

}


/* =====================================================
   FOLLOWING
===================================================== */

async function loadFollowing() {

  const {
    data,
    error
  } = await db
    .from("follows")
    .select("following_id")
    .eq("follower_id", me.id);

  if (error) {

    console.error(error);

    return;
  }

  followingIds =
    new Set(
      (data || []).map(
        x => x.following_id
      )
    );

}


/* =====================================================
   PROFILES
===================================================== */

async function loadProfiles() {

  const {
    data,
    error
  } = await db
    .from("profiles")
    .select(`
      id,
      username,
      display_name,
      bio,
      avatar_url,
      followers_count,
      following_count
    `)
    .neq("id",me.id)
    .order("followers_count", {
      ascending:false
    });

  if (error) {

    console.error(error);

    document.getElementById("users").innerHTML =
      `<div class="empty">
          
      </div>`;

    return;
  }

  allProfiles =
    data || [];

}


/* =====================================================
   STORIES
===================================================== */

async function loadStories() {

  const {
    data,
    error
  } = await db
    .from("stories")
    .select(`
      id,
      user_id,
      media_url,
      media_type,
      created_at,
      expires_at
    `)
    .gt(
      "expires_at",
      new Date().toISOString()
    )
    .order(
      "created_at",
      {
        ascending:false
      }
    );

  if (error) {

    console.error(
      "Stories:",
      error
    );

    return;
  }

  if (!data || !data.length) {

    renderStories([]);

    return;
  }


  const ids =
    [
      ...new Set(
        data.map(
          s => s.user_id
        )
      )
    ];


  const {
    data: profiles
  } =
    await db
      .from("profiles")
      .select(`
        id,
        username,
        display_name,
        avatar_url
      `)
      .in("id",ids);


  const profileMap =
    new Map(
      (profiles || []).map(
        p => [p.id,p]
      )
    );


  allStories =
    data
      .map(story => {

        const profile =
          profileMap.get(
            story.user_id
          );

        if (!profile)
          return null;

        return {
          ...story,
          profile
        };

      })
      .filter(Boolean);


  renderStories(
    allStories
  );

}


/* =====================================================
   RENDER STORIES
===================================================== */

function renderStories(stories) {

  const container =
    document.getElementById(
      "stories"
    );


  let html = `

    <div
      class="story add-story"
      onclick="openStoryUpload()"
    >

      <div class="story-avatar">

        <div class="story-avatar-inner">
          +
        </div>

      </div>

      <div class="story-name">
        
      </div>

    </div>

  `;


  const used =
    new Set();


  stories.forEach(
    story => {

      if (
        used.has(
          story.user_id
        )
      ) return;

      used.add(
        story.user_id
      );


      html += `

        <div
          class="story"
          onclick="openUserStories('${story.user_id}')"
        >

          <div class="story-avatar">

            <div class="story-avatar-inner">

              <img
                src="${avatar(
                  story.profile.avatar_url
                )}"
                alt=""
              >

            </div>

          </div>

          <div class="story-name">

            ${escapeHtml(
              story.profile.display_name ||
              story.profile.username ||
              ""
            )}

          </div>

        </div>

      `;

    }
  );


  container.innerHTML =
    html;

}


/* =====================================================
   OPEN USER STORIES
===================================================== */

function openUserStories(userId) {

  const indexes =
    allStories
      .map(
        (story,index) =>
          story.user_id === userId
            ? index
            : -1
      )
      .filter(
        index => index !== -1
      );


  if (!indexes.length)
    return;


  currentStoryIndex =
    indexes[0];


  showStory(
    currentStoryIndex
  );

}


/* =====================================================
   SHOW STORY
===================================================== */

function showStory(index) {

  if (
    !allStories.length
  ) return;


  if (
    index < 0 ||
    index >= allStories.length
  ) return;


  currentStoryIndex =
    index;


  const story =
    allStories[index];


  document.getElementById(
    "viewerAvatar"
  ).src =
    avatar(
      story.profile.avatar_url
    );


  document.getElementById(
    "viewerName"
  ).textContent =
    story.profile.display_name ||
    story.profile.username ||
    "";


  const container =
    document.getElementById(
      "storyMediaContainer"
    );


  container.innerHTML =
    "";


  if (
    story.media_type ===
    "video"
  ) {

    const video =
      document.createElement(
        "video"
      );

    video.src =
      story.media_url;

    video.className =
      "story-media";

    video.controls =
      true;

    video.autoplay =
      true;

    video.playsInline =
      true;

    container.appendChild(
      video
    );

  } else {

    const image =
      document.createElement(
        "img"
      );

    image.src =
      story.media_url;

    image.className =
      "story-media";

    container.appendChild(
      image
    );

  }


  document
    .getElementById(
      "storyViewer"
    )
    .classList.add(
      "show"
    );

}


function closeStoryViewer() {

  const viewer =
    document.getElementById(
      "storyViewer"
    );

  viewer.classList.remove(
    "show"
  );

  document.getElementById(
    "storyMediaContainer"
  ).innerHTML =
    "";

}


/* =====================================================
   STORY NAVIGATION
===================================================== */

function nextStory() {

  if (
    currentStoryIndex <
    allStories.length - 1
  ) {

    showStory(
      currentStoryIndex + 1
    );

  } else {

    closeStoryViewer();

  }

}


function previousStory() {

  if (
    currentStoryIndex > 0
  ) {

    showStory(
      currentStoryIndex - 1
    );

  }

}


/* =====================================================
   ALL STORIES
===================================================== */

function showAllStories() {

  if (!allStories.length) {

    showToast(
      "   "
    );

    return;
  }

  showStory(0);

}


/* =====================================================
   STORY UPLOAD MODAL
===================================================== */

function openStoryUpload() {

  document
    .getElementById(
      "storyModal"
    )
    .classList.add(
      "show"
    );

}


function closeStoryUpload() {

  document
    .getElementById(
      "storyModal"
    )
    .classList.remove(
      "show"
    );

  document.getElementById(
    "storyFile"
  ).value =
    "";

}


/* =====================================================
   UPLOAD STORY
===================================================== */

async function uploadStory() {

  if (!me) return;


  const input =
    document.getElementById(
      "storyFile"
    );


  const file =
    input.files[0];


  if (!file) {

    showToast(
      "    "
    );

    return;
  }


  const button =
    document.getElementById(
      "uploadStoryButton"
    );


  button.disabled =
    true;

  button.textContent =
    " ...";


  try {

    const extension =
      file.name
        .split(".")
        .pop()
        .toLowerCase();


    const path =
      me.id +
      "/" +
      Date.now() +
      "-" +
      Math.random()
        .toString(36)
        .substring(2) +
      "." +
      extension;


    const {
      error: uploadError
    } =
      await db.storage
        .from("stories")
        .upload(
          path,
          file,
          {
            upsert:false
          }
        );


    if (uploadError)
      throw uploadError;


    const {
      data: publicData
    } =
      db.storage
        .from("stories")
        .getPublicUrl(
          path
        );


    const mediaType =
      file.type.startsWith(
        "video/"
      )
        ? "video"
        : "image";


    const {
      error: insertError
    } =
      await db
        .from("stories")
        .insert({

          user_id:
            me.id,

          media_url:
            publicData.publicUrl,

          media_type:
            mediaType,

          expires_at:
            new Date(
              Date.now() +
              24 * 60 * 60 * 1000
            ).toISOString()

        });


    if (insertError)
      throw insertError;


    showToast(
      "   "
    );


    closeStoryUpload();

    await loadStories();


  } catch(error) {

    console.error(
      error
    );

    showToast(
      "    "
    );

  }


  button.disabled =
    false;

  button.textContent =
    " ";

}


/* =====================================================
   RENDER USERS
===================================================== */

function renderUsers() {

  const container =
    document.getElementById(
      "users"
    );


  const search =
    document
      .getElementById(
        "searchInput"
      )
      .value
      .trim()
      .toLowerCase();


  let users =
    allProfiles.filter(
      profile => {

        const name =
          (
            profile.display_name ||
            ""
          ).toLowerCase();


        const username =
          (
            profile.username ||
            ""
          ).toLowerCase();


        const matches =
          !search ||
          name.includes(search) ||
          username.includes(search);


        if (!matches)
          return false;


        if (
          currentFriendTab ===
          "friends"
        ) {

          return followingIds.has(
            profile.id
          );

        }


        if (
          currentFriendTab ===
          "following"
        ) {

          return followingIds.has(
            profile.id
          );

        }


        if (
          currentFriendTab ===
          "suggestions"
        ) {

          return !followingIds.has(
            profile.id
          );

        }


        return true;

      }
    );


  if (!users.length) {

    container.innerHTML = `

      <div class="empty">

        ${
          currentFriendTab === "friends"
          ? "      ."
          : currentFriendTab === "following"
          ? "   ."
          : "   ."
        }

      </div>

    `;

    return;

  }


  container.innerHTML =
    users
      .map(
        user => {

          const isFollowing =
            followingIds.has(
              user.id
            );


          return `

            <div class="user-card">

              <img
                class="avatar"
                src="${avatar(
                  user.avatar_url
                )}"
                alt=""
                onclick="openUserProfile('${user.id}')"
              >


              <div
                class="user-info"
                onclick="openUserProfile('${user.id}')"
              >

                <div class="user-name">

                  ${escapeHtml(
                    user.display_name ||
                    user.username ||
                    ""
                  )}

                </div>


                <div class="username">

                  @${escapeHtml(
                    user.username ||
                    ""
                  )}

                </div>


                <div class="followers">

                  ${Number(
                    user.followers_count ||
                    0
                  ).toLocaleString("ar-EG")}

                  

                </div>

              </div>


              <div class="user-actions">

                <button
                  class="message-btn"
                  onclick="openChat('${user.id}')"
                  title=""
                >
                  
                </button>


                <button
                  class="follow-btn ${
                    isFollowing
                      ? "following"
                      : ""
                  }"
                  onclick="toggleFollow(
                    '${user.id}',
                    this
                  )"
                >

                  ${
                    isFollowing
                      ? ""
                      : ""
                  }

                </button>

              </div>

            </div>

          `;

        }
      )
      .join("");

}


/* =====================================================
   FOLLOW / UNFOLLOW
===================================================== */

async function toggleFollow(
  userId,
  button
) {

  if (!me) return;


  const isFollowing =
    followingIds.has(
      userId
    );


  button.disabled =
    true;


  try {

    if (isFollowing) {

      const {
        error
      } =
        await db
          .from("follows")
          .delete()
          .eq(
            "follower_id",
            me.id
          )
          .eq(
            "following_id",
            userId
          );


      if (error)
        throw error;


      followingIds.delete(
        userId
      );


      showToast(
        "  "
      );


    } else {

      const {
        error
      } =
        await db
          .from("follows")
          .insert({

            follower_id:
              me.id,

            following_id:
              userId

          });


      if (error)
        throw error;


      followingIds.add(
        userId
      );


      showToast(
        "  "
      );

    }


    await loadProfiles();

    renderUsers();


  } catch(error) {

    console.error(
      error
    );

    showToast(
      "    "
    );

  }


  button.disabled =
    false;

}


/* =====================================================
   FRIEND TABS
===================================================== */

function showFriendTab(tab) {

  currentFriendTab =
    tab;


  document
    .querySelectorAll(
      ".friend-tab"
    )
    .forEach(
      button =>
        button.classList.remove(
          "active"
        )
    );


  const active =
    document.getElementById(
      "friend-" +
      tab
    );


  if (active)
    active.classList.add(
      "active"
    );


  renderUsers();

}


/* =====================================================
   MAIN TABS
===================================================== */

function showMainTab(tab) {

  currentMainTab =
    tab;


  document
    .querySelectorAll(
      ".main-tab"
    )
    .forEach(
      button =>
        button.classList.remove(
          "active"
        )
    );


  const active =
    document.getElementById(
      "main-" +
      tab
    );


  if (active)
    active.classList.add(
      "active"
    );


  const friends =
    document.getElementById(
      "friendsSection"
    );


  const messages =
    document.getElementById(
      "messagesSection"
    );


  if (tab === "friends") {

    friends.style.display =
      "block";

    messages.style.display =
      "none";

  } else {

    friends.style.display =
      "none";

    messages.style.display =
      "block";

    loadConversations();

  }

}


/* =====================================================
   CONVERSATIONS
===================================================== */

async function loadConversations() {

  const container =
    document.getElementById(
      "conversations"
    );


  /*
      .
       messages  
        .
  */


  const {
    data,
    error
  } =
    await db
      .from("messages")
      .select("*")
      .or(
        `sender_id.eq.${me.id},receiver_id.eq.${me.id}`
      )
      .order(
        "created_at",
        {
          ascending:false
        }
      );


  if (error) {

    console.log(
      "messages table:",
      error.message
    );


    container.innerHTML = `

      <div class="empty">

        <br><br>

            .<br>

                 .

      </div>

    `;

    return;

  }


  if (!data || !data.length) {

    container.innerHTML = `

      <div class="empty">

        <br><br>

            .<br>

            .

      </div>

    `;

    return;

  }


  const otherIds =
    [
      ...new Set(
        data.map(message =>

          message.sender_id === me.id
            ? message.receiver_id
            : message.sender_id

        )
      )
    ];


  const {
    data: profiles
  } =
    await db
      .from("profiles")
      .select(`
        id,
        username,
        display_name,
        avatar_url
      `)
      .in(
        "id",
        otherIds
      );


  const profileMap =
    new Map(
      (profiles || []).map(
        p => [p.id,p]
      )
    );


  const latest =
    new Map();


  data.forEach(
    message => {

      const otherId =
        message.sender_id === me.id
          ? message.receiver_id
          : message.sender_id;


      if (!latest.has(otherId)) {

        latest.set(
          otherId,
          message
        );

      }

    }
  );


  let html = "";


  latest.forEach(
    (message,otherId) => {

      const profile =
        profileMap.get(
          otherId
        );


      if (!profile)
        return;


      html += `

        <div
          class="conversation-card"
          onclick="openChat('${otherId}')"
        >

          <img
            class="avatar"
            src="${avatar(
              profile.avatar_url
            )}"
            alt=""
          >


          <div class="conversation-info">

            <div class="conversation-name">

              ${escapeHtml(
                profile.display_name ||
                profile.username ||
                ""
              )}

            </div>


            <div class="conversation-last">

              ${escapeHtml(
                message.content ||
                ""
              )}

            </div>

          </div>


          <div class="conversation-time">

            ${formatTime(
              message.created_at
            )}

          </div>

        </div>

      `;

    }
  );


  container.innerHTML =
    html ||
    `
      <div class="empty">
          .
      </div>
    `;

}


/* =====================================================
   TIME
===================================================== */

function formatTime(date) {

  if (!date)
    return "";


  try {

    return new Date(
      date
    ).toLocaleDateString(
      "ar-EG",
      {
        day:"numeric",
        month:"short"
      }
    );

  } catch {

    return "";

  }

}


/* =====================================================
   OPEN CHAT
===================================================== */

function openChat(userId) {

  /*
        messages.html
       .
  */

  window.location.href =
    "./messages.html?user=" +
    encodeURIComponent(
      userId
    );

}


/* =====================================================
   SEARCH
===================================================== */

document
  .getElementById(
    "searchInput"
  )
  .addEventListener(
    "input",
    () => {

      if (
        currentMainTab ===
        "friends"
      ) {

        renderUsers();

      }

    }
  );


/* =====================================================
   NAVIGATION
===================================================== */

function goHome() {

  window.location.href =
    "../index.html";

}


function openUpload() {

  window.location.href =
    "./upload.html";

}


function openNotifications() {

  window.location.href =
    "./notifications.html";

}


function openProfile() {

  window.location.href =
    "./profile.html";

}


function openUserProfile(
  userId
) {

  window.location.href =
    "./profile.html?id=" +
    encodeURIComponent(
      userId
    );

}


function goBack() {

  if (
    history.length > 1
  ) {

    history.back();

  } else {

    goHome();

  }

}


/* =====================================================
   REALTIME FOLLOWS
===================================================== */

db.channel(
  "vibex-friends-follows"
)
.on(
  "postgres_changes",
  {
    event:"*",
    schema:"public",
    table:"follows"
  },
  async () => {

    await loadFollowing();

    await loadProfiles();

    if (
      currentMainTab ===
      "friends"
    ) {

      renderUsers();

    }

  }
)
.subscribe();


/* =====================================================
   REALTIME STORIES
===================================================== */

db.channel(
  "vibex-friends-stories"
)
.on(
  "postgres_changes",
  {
    event:"*",
    schema:"public",
    table:"stories"
  },
  async () => {

    await loadStories();

  }
)
.subscribe();


/* =====================================================
   START
===================================================== */

init();

</script>
