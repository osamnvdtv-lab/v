async function init(){

 const {
  data:videos,
  error
 }=await db
 .from("videos")
 .select(`
  id,
  user_id,
  caption,
  video_url,
  thumbnail_url,
  views_count,
  likes_count,
  comments_count,
  created_at
 `)
 .order(

 );

 if(error){

  console.error(error);
  showToast("تعذر تحميل الفيديوهات");
  return;

 }

 allVideos=videos||[];

 if(!allVideos.length){

  document.getElementById("empty").style.display="flex";

 const userIds=[
  ...new Set(
   allVideos.map(v=>v.user_id)
  )
 ];

 if(userIds.length){

  const {data:profiles}=await db
  .from("profiles")
  .select(`
   id,
   username,
   display_name,
   avatar_url
  `)
  .in("id",userIds);

  (profiles||[]).forEach(profile=>{
   profileCache.set(profile.id,profile);
  });

 }

 renderFeed();

}

========================================= */

   VIDEO INTERACTIONS

function setupVideoInteractions(card,video){

 const videoEl=card.querySelector(".video");
 const playButton=card.querySelector(".center-play");
 const speedIndicator=card.querySelector(".speed-indicator");

 let localLastTap=0;

 /* الضغط العادي + الضغط المزدوج */
 videoEl.addEventListener("click",()=>{

  const now=Date.now();

  if(now-localLastTap<350){

   doubleLike(card,video.id);

   localLastTap=0;

   return;

  }

  localLastTap=now;

  setTimeout(()=>{

   if(
    Date.now()-localLastTap>=330
   ){

    toggleVideo(
     videoEl,
     playButton
    );

   }

  },340);

 });


 /*
  الضغط المطول على أسفل الشاشة
  = سرعة ×2
 */
 videoEl.addEventListener(
  "pointerdown",
  event=>{

   const rect=
   videoEl.getBoundingClientRect();

   const y=
   event.clientY-rect.top;

   const isBottom=
   y>rect.height*.70;

   if(!isBottom)return;

   clearTimeout(longPressTimer);

   longPressTimer=setTimeout(()=>{

    speedVideo=videoEl;

    videoEl.playbackRate=2;

    speedIndicator.classList.add("show");

   },350);

  }
 );


 function stopSpeed(){

  clearTimeout(longPressTimer);

  if(speedVideo===videoEl){

   videoEl.playbackRate=1;

   speedIndicator.classList.remove("show");

   speedVideo=null;

  }

 }

 videoEl.addEventListener(
  "pointerup",
  stopSpeed
 );

 videoEl.addEventListener(
  "pointercancel",
  stopSpeed
 );

 videoEl.addEventListener(
  "pointerleave",
  stopSpeed
 );


 videoEl.addEventListener(
  "pause",
  ()=>{

   playButton.textContent="▶";
   playButton.classList.add("show");

  }
 );


 videoEl.addEventListener(
  "playing",
  ()=>{

   playButton.classList.remove("show");

  }
 );


 playButton.addEventListener(
  "click",
  event=>{

   event.stopPropagation();

   toggleVideo(
    videoEl,
    playButton
   );

  }
 );

  card.querySelector(".big-heart");

  heart.classList.remove("show");

function toggleVideo(videoEl,playButton){

  videoEl.play()
  .then(()=>{

   playButton.classList.remove("show");

  })
  .catch(()=>{

   videoEl.muted=true;

   videoEl.play()
   .then(()=>{

     "اضغط مرة أخرى لتشغيل الصوت 🔊"

 }

 }

}

async function loadComments(videoId){

 const list=
 document.getElementById("commentsList");

 list.innerHTML=`
  <div style="
   text-align:center;
   color:#aaa;
   padding:30px;
  ">
   جاري تحميل التعليقات...
  </div>
 `;

 const {
  data:comments,
  error
 }=await db
 .from("comments")
 .select(`
  id,
  user_id,
  content,
  created_at
 `)
 .eq("video_id",videoId)
 .order(
  "created_at",
  {ascending:true}
 );

 if(error){

  list.innerHTML=`
   <div style="
    text-align:center;
    color:#aaa;
    padding:30px;
   ">
    تعذر تحميل التعليقات
   </div>
  `;

  return;

 }

 document.getElementById(
  "commentsCount"
 ).textContent=comments.length;

 if(!comments.length){

  list.innerHTML=`
   <div style="
    text-align:center;
    color:#aaa;
    padding:30px;
   ">
    لا توجد تعليقات بعد
   </div>
  `;

  return;

 }

 const ids=[
  ...new Set(
   comments.map(c=>c.user_id)
  )
 ];

 const {
  data:profiles
 }=await db
 .from("profiles")
 .select(`
  id,
  username,
  display_name,
  avatar_url
 `)
 .in("id",ids);

 const profileMap=
 new Map(
  (profiles||[]).map(
   p=>[p.id,p]
  )
 );

 list.innerHTML="";

 comments.forEach(comment=>{

  const profile=
  profileMap.get(
   comment.user_id
  )||{};

  const row=
  document.createElement("div");

  row.className="comment";

  row.innerHTML=`

   <img
    class="comment-avatar"
    src="${escapeAttr(
     profile.avatar_url||
     "https://ui-avatars.com/api/?name=V&background=222&color=fff"
    )}">

   <div>

    <div class="comment-user">
     @${escapeHtml(
      profile.username||"user"
     )}
    </div>

    <div class="comment-text">
     ${escapeHtml(
      comment.content
     )}
    </div>

   </div>
  `;

  list.appendChild(row);

 });

 list.scrollTop=list.scrollHeight;

}

/* =========================================
   OBSERVER
========================================= */

function setupObserver(){

 if(observer){
  observer.disconnect();
 }

 const cards=
 document.querySelectorAll(
  ".video-card"
 );

 observer=
 new IntersectionObserver(
  entries=>{

   entries.forEach(entry=>{

    const video=
    entry.target.querySelector(".video");

    if(entry.isIntersecting){

     video.muted=false;

     video.play()
     .catch(()=>{

      video.muted=true;

      video.play()
      .catch(()=>{});

     });

     incrementView(
      entry.target.dataset.videoId
     );

    }

    else{

     video.pause();

     video.playbackRate=1;

    }

   });

  },
  {threshold:.7}
 );

 cards.forEach(card=>{
  observer.observe(card);
 });

}


/* =========================================
   VIEWS
========================================= */

const viewedVideos=new Set();

async function incrementView(videoId){

 if(viewedVideos.has(videoId)){
  return;
 }

 viewedVideos.add(videoId);

 try{

  const video=
  allVideos.find(
   v=>v.id===videoId
  );

  if(!video)return;

  const newCount=
  Number(video.views_count||0)+1;

  /*
   محاولة تحديث الرقم
   حسب صلاحيات Supabase
  */
  const {error}=
  await db
  .from("videos")
  .update({
   views_count:newCount
  })
  .eq("id",videoId);

  if(!error){

   video.views_count=newCount;

   const card=
   document.querySelector(
    `[data-video-id="${videoId}"]`
   );

   const el=
   card?.querySelector(
    ".views-number"
   );

   if(el){
    el.textContent=
    formatNumber(newCount);
   }

  }

 }

 catch(error){

  console.log(
   "View update skipped",
   error
  );

 }

}

/* =========================================
   HELPERS
========================================= */

function formatNumber(number){

 number=Number(number||0);

 if(number>=1000000){

  return(
   (number/1000000)
   .toFixed(1)
   .replace(".0","")
   +"M"
  );

 }

 if(number>=1000){

  return(
   (number/1000)
   .toFixed(1)
   .replace(".0","")
   +"K"
  );

 }

 return String(number);

}


function escapeHtml(value){

 return String(value??"")
 .replace(/&/g,"&amp;")
 .replace(/</g,"&lt;")
 .replace(/>/g,"&gt;")
 .replace(/"/g,"&quot;")
 .replace(/'/g,"&#039;");

}


function escapeAttr(value){

 return escapeHtml(value);

}


/* =========================================

========================================= */

function showToast(message){

 const toast=
 document.getElementById("toast");

 toast.textContent=message;

 toast.classList.add("show");

 clearTimeout(toastTimer);

 toastTimer=setTimeout(()=>{

  toast.classList.remove("show");

 },2500);

}
