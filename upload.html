<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>إنشاء منشور | VIBEX</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #080808;
      color: #fff;
      min-height: 100vh;
      padding-bottom: 90px;
    }

    button,
    textarea,
    input {
      font-family: inherit;
    }

    button {
      border: 0;
      cursor: pointer;
    }

    .header {
      height: 65px;
      position: sticky;
      top: 0;
      z-index: 50;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 15px;
      background: rgba(8,8,8,.96);
      backdrop-filter: blur(15px);
      border-bottom: 1px solid #222;
    }

    .back {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: #181818;
      color: #fff;
      font-size: 28px;
    }

    .title {
      font-size: 18px;
      font-weight: bold;
    }

    .logo {
      font-size: 23px;
      font-weight: 900;
      background: linear-gradient(90deg,#8b5cf6,#ec4899);
      -webkit-background-clip: text;
      color: transparent;
    }

    .container {
      padding: 18px 15px;
      max-width: 650px;
      margin: auto;
    }

    .composer {
      background: #111;
      border: 1px solid #252525;
      border-radius: 20px;
      padding: 16px;
    }

    .composer-title {
      font-size: 18px;
      font-weight: bold;
      margin-bottom: 15px;
    }

    textarea {
      width: 100%;
      min-height: 120px;
      resize: vertical;
      background: #191919;
      border: 1px solid #292929;
      color: #fff;
      border-radius: 15px;
      padding: 14px;
      outline: none;
      font-size: 15px;
      line-height: 1.7;
    }

    textarea::placeholder {
      color: #777;
    }

    .media-title {
      margin-top: 18px;
      margin-bottom: 10px;
      color: #ccc;
      font-size: 14px;
      font-weight: bold;
    }

    .media-buttons {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }

    .media-btn {
      min-height: 90px;
      border-radius: 16px;
      background: linear-gradient(145deg,#191919,#101010);
      border: 1px solid #292929;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 7px;
      font-size: 13px;
    }

    .media-btn:active {
      transform: scale(.97);
    }

    .media-icon {
      font-size: 30px;
    }

    .camera-btn {
      background: linear-gradient(145deg,#24123b,#111);
    }

    .audio-btn {
      background: linear-gradient(145deg,#351327,#111);
    }

    .preview {
      margin-top: 15px;
      display: none;
      border-radius: 16px;
      overflow: hidden;
      background: #151515;
      border: 1px solid #292929;
      padding: 10px;
    }

    .preview.show {
      display: block;
    }

    .preview img,
    .preview video {
      display: block;
      width: 100%;
      max-height: 420px;
      object-fit: contain;
      border-radius: 12px;
      background: #000;
    }

    audio {
      width: 100%;
    }

    .file-name {
      color: #aaa;
      font-size: 12px;
      margin-top: 8px;
      word-break: break-word;
    }

    .remove-btn {
      margin-top: 10px;
      width: 100%;
      padding: 10px;
      border-radius: 10px;
      background: #292929;
      color: #fff;
    }

    .publish-btn {
      width: 100%;
      margin-top: 18px;
      padding: 14px;
      border-radius: 14px;
      background: linear-gradient(90deg,#8b5cf6,#ec4899);
      color: #fff;
      font-size: 16px;
      font-weight: bold;
    }

    .publish-btn:disabled {
      opacity: .5;
      cursor: not-allowed;
    }

    .permission-box {
      margin-top: 15px;
      padding: 13px;
      border-radius: 13px;
      background: #171717;
      border: 1px solid #292929;
      color: #aaa;
      font-size: 12px;
      line-height: 1.7;
    }

    .permission-box strong {
      color: #fff;
    }

    .bottom-nav {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      height: 70px;
      background: rgba(10,10,10,.97);
      border-top: 1px solid #222;
      display: flex;
      align-items: center;
      justify-content: space-around;
      z-index: 100;
    }

    .nav-btn {
      background: none;
      color: #777;
      font-size: 11px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 5px;
    }

    .nav-icon {
      font-size: 21px;
    }

    .nav-btn.active {
      color: #fff;
    }

    .publish-icon {
      width: 48px;
      height: 38px;
      border-radius: 11px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(90deg,#8b5cf6,#ec4899);
      font-size: 23px;
      color: #fff;
    }

    .toast {
      position: fixed;
      left: 50%;
      bottom: 88px;
      transform: translateX(-50%) translateY(20px);
      background: #222;
      color: #fff;
      padding: 11px 17px;
      border-radius: 12px;
      opacity: 0;
      pointer-events: none;
      transition: .3s;
      z-index: 300;
      font-size: 13px;
      max-width: 90%;
      text-align: center;
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    /* نافذة الكاميرا */

    .camera-modal {
      position: fixed;
      inset: 0;
      background: #000;
      z-index: 500;
      display: none;
      flex-direction: column;
    }

    .camera-modal.show {
      display: flex;
    }

    .camera-top {
      height: 65px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 15px;
      background: #080808;
    }

    .camera-title {
      font-weight: bold;
    }

    .close-camera {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: #222;
      color: #fff;
      font-size: 22px;
    }

    .camera-area {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    #cameraVideo {
      width: 100%;
      max-height: 100%;
      object-fit: cover;
    }

    .camera-bottom {
      min-height: 100px;
      background: #080808;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .capture {
      width: 70px;
      height: 70px;
      border-radius: 50%;
      background: #fff;
      border: 7px solid #555;
    }

    @media (max-width: 420px) {
      .media-buttons {
        gap: 7px;
      }

      .media-btn {
        min-height: 82px;
      }
    }
  </style>
</head>

<body>

<header class="header">
  <button class="back" onclick="goBack()">‹</button>
  <div class="title">إنشاء منشور</div>
  <div class="logo">VIBEX</div>
</header>

<main class="container">

  <div class="composer">

    </div>

    <textarea
      id="postText"
      placeholder="اكتب شيئًا تريد مشاركته..."
    ></textarea>

    <div class="media-title">
      أضف صورة أو فيديو أو صوت
    </div>

    <div class="media-buttons">

      <!-- الصور: يفتح معرض الصور مباشرة -->
      <button
        class="media-btn"

      >

      لا يتم تشغيل الكاميرا أو تسجيل الصوت بدون موافقتك.
    </div>

  </div>

</main>


<!-- CAMERA -->

<div
  id="cameraModal"
  class="camera-modal"
>

<div
  id="toast"
  class="toast"
></div>


<script>

  /* =========================
     SUPABASE
  ========================= */

  const SUPABASE_URL =
    "https://uxeflbmxngnaygrvrsbe.supabase.co";

  const SUPABASE_KEY =
    "sb_publishable_wKRwXTeO5ZeBKIQ7EbW5Xw_ockmVLNq";

  const db =
    window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );


  let me = null;

  let selectedFile = null;

  let selectedType = null;

  let cameraStream = null;

  let mediaRecorder = null;

  let audioChunks = [];

  let recordedAudioBlob = null;


  /* =========================
     TOAST
  ========================= */

  function showToast(message) {

    const toast =
      document.getElementById("toast");

    toast.textContent = message;

    toast.classList.add("show");

    setTimeout(() => {

      toast.classList.remove("show");

    }, 2500);

  }


  /* =========================
     AUTH
  ========================= */

  async function init() {

    const {
      data: {
        session
      }
    } = await db.auth.getSession();


    if (!session) {

      window.location.href =
        "./login.html";

      return;

    }


    me = session.user;

  }


  /* =========================
     PHOTOS
  ========================= */

  function openPhotos() {

    const input =
      document.getElementById(
        "photoInput"
      );

    input.click();

  }


  document
    .getElementById("photoInput")
    .addEventListener(
      "change",
      function() {

        const file =
          this.files &&
          this.files[0];

        if (!file)
          return;

        selectedFile = file;

        selectedType = "image";

        recordedAudioBlob = null;

        showPreview(file);

      }
    );


  /* =========================
     VIDEO FILE
  ========================= */

  function openVideo() {

    document
      .getElementById("videoInput")
      .click();

  }


  document
    .getElementById("videoInput")
    .addEventListener(
      "change",
      function() {

        const file =
          this.files &&
          this.files[0];

        if (!file)
          return;

        selectedFile = file;

        selectedType = "video";

        recordedAudioBlob = null;

        showPreview(file);

      }
    );


  /* =========================
     PREVIEW
  ========================= */

  function showPreview(file) {

    const preview =
      document.getElementById(
        "preview"
      );

    const url =
      URL.createObjectURL(file);


    if (selectedType === "image") {

      preview.innerHTML = `

        <img
          src="${url}"
          alt="معاينة الصورة"
        >

        <div class="file-name">
          ${escapeHtml(file.name)}
        </div>

        <button
          class="remove-btn"
          onclick="removeMedia()"
        >
          حذف الصورة
        </button>

      `;

    }


    if (selectedType === "video") {

      preview.innerHTML = `

        <video
          src="${url}"
          controls
          playsinline
        ></video>

        <div class="file-name">
          ${escapeHtml(file.name)}
        </div>

        <button
          class="remove-btn"
          onclick="removeMedia()"
        >
          حذف الفيديو
        </button>

      `;

    }


    preview.classList.add("show");

  }


  function showAudioPreview(blob) {

    const preview =
      document.getElementById(
        "preview"
      );

    const url =
      URL.createObjectURL(blob);


    preview.innerHTML = `

      <audio
        src="${url}"
        controls
      ></audio>

      <div class="file-name">
        تسجيل صوتي
      </div>

      <button
        class="remove-btn"
        onclick="removeMedia()"
      >
        حذف التسجيل
      </button>

    `;

    preview.classList.add("show");

  }


  function removeMedia() {

    selectedFile = null;

    selectedType = null;

    recordedAudioBlob = null;

    document
      .getElementById("photoInput")
      .value = "";

    document
      .getElementById("videoInput")
      .value = "";

    const preview =
      document.getElementById(
        "preview"
      );

    preview.innerHTML = "";

    preview.classList.remove(
      "show"
    );

  }


  /* =========================
     CAMERA
  ========================= */

  async function openCamera() {

    try {

      cameraStream =
        await navigator.mediaDevices.getUserMedia({
          video: {
            facingMode: {
              ideal: "environment"
            }
          },
          audio: false
        });


      const video =
        document.getElementById(
          "cameraVideo"
        );

      video.srcObject =
        cameraStream;


      document
        .getElementById(
          "cameraModal"
        )
        .classList.add("show");


    } catch (error) {

      console.error(error);

      showToast(
        "يجب السماح للكاميرا من إعدادات المتصفح"
      );

    }

  }


  function capturePhoto() {

    const video =
      document.getElementById(
        "cameraVideo"
      );


    if (
      !video.videoWidth ||
      !video.videoHeight
    ) {

      showToast(
        "انتظر حتى تفتح الكاميرا"
      );

      return;

    }


    const canvas =
      document.createElement(
        "canvas"
      );


    canvas.width =
      video.videoWidth;

    canvas.height =
      video.videoHeight;


    const ctx =
      canvas.getContext("2d");


    ctx.drawImage(
      video,
      0,
      0,
      canvas.width,
      canvas.height
    );


    canvas.toBlob(
      function(blob) {

        selectedFile =
          new File(
            [blob],
            "camera-photo.jpg",
            {
              type: "image/jpeg"
            }
          );

        selectedType =
          "image";

        recordedAudioBlob =
          null;

        closeCamera();

        showPreview(
          selectedFile
        );

      },
      "image/jpeg",
      0.92
    );

  }


  function closeCamera() {

    const modal =
      document.getElementById(
        "cameraModal"
      );

    modal.classList.remove(
      "show"
    );


    if (cameraStream) {

      cameraStream
        .getTracks()
        .forEach(
          track =>
            track.stop()
        );

      cameraStream = null;

    }


    const video =
      document.getElementById(
        "cameraVideo"
      );

    video.srcObject = null;

  }


  /* =========================
     AUDIO
  ========================= */

  async function startAudio() {

    if (
      !navigator.mediaDevices ||
      !navigator.mediaDevices.getUserMedia
    ) {

      showToast(
        "المتصفح لا يدعم تسجيل الصوت"
      );

      return;

    }


    try {

      const stream =
        await navigator.mediaDevices
          .getUserMedia({
            audio: true
          });


      audioChunks = [];


      let options = {};

      if (
        MediaRecorder.isTypeSupported(
          "audio/webm"
        )
      ) {

        options.mimeType =
          "audio/webm";

      }


      mediaRecorder =
        new MediaRecorder(
          stream,
          options
        );


      mediaRecorder.ondataavailable =
        function(event) {

          if (
            event.data &&
            event.data.size > 0
          ) {

            audioChunks.push(
              event.data
            );

          }

        };


      mediaRecorder.onstop =
        function() {

          const blob =
            new Blob(
              audioChunks,
              {
                type:
                  mediaRecorder.mimeType ||
                  "audio/webm"
              }
            );


          recordedAudioBlob =
            blob;

          selectedFile = null;

          selectedType =
            "audio";

          showAudioPreview(
            blob
          );


          stream
            .getTracks()
            .forEach(
              track =>
                track.stop()
            );

        };


      mediaRecorder.start();

      showToast(
        "🎤 جاري تسجيل الصوت..."
      );


      setTimeout(
        stopAudio,
        15000
      );


    } catch (error) {

      console.error(error);

      showToast(
        "يجب السماح للميكروفون من إعدادات المتصفح"
      );

    }

  }


  function stopAudio() {

    if (
      mediaRecorder &&
      mediaRecorder.state ===
        "recording"
    ) {

      mediaRecorder.stop();

      showToast(
        "تم الانتهاء من تسجيل الصوت"
      );

    }

  }


  /* =========================
     PUBLISH
  ========================= */

  async function publishPost() {

    if (!me) {

      showToast(
        "يجب تسجيل الدخول أولًا"
      );

      return;

    }


    const text =
      document
        .getElementById("postText")
        .value
        .trim();


    if (
      !text &&
      !selectedFile &&
      !recordedAudioBlob
    ) {

      showToast(
        "اكتب شيئًا أو أضف صورة أو فيديو أو صوت"
      );

      return;

    }


    const button =
      document.getElementById(
        "publishBtn"
      );


    button.disabled = true;

    button.textContent =
      "جاري النشر...";


    try {

      let mediaUrl = null;

      let mediaType = null;


      /*
       * رفع الصورة / الفيديو
       */

      if (selectedFile) {

        const extension =
          selectedFile.name
            .split(".")
            .pop() ||
          (
            selectedType === "image"
              ? "jpg"
              : "mp4"
          );


        const path =
          me.id +
          "/" +
          Date.now() +
          "-" +
          crypto.randomUUID() +
          "." +
          extension;


        const {
          error:
            uploadError
        } = await db
          .storage
          .from("posts")
          .upload(
            path,
            selectedFile,
            {
              contentType:
                selectedFile.type,
              upsert: false
            }
          );


        if (uploadError) {

          throw uploadError;

        }


        const {
          data:
            publicData
        } = db
          .storage
          .from("posts")
          .getPublicUrl(
            path
          );


        mediaUrl =
          publicData.publicUrl;

        mediaType =
          selectedType;

      }


      /*
       * رفع الصوت
       */

      if (
        recordedAudioBlob
      ) {

        const path =
          me.id +
          "/" +
          Date.now() +
          "-" +
          crypto.randomUUID() +
          ".webm";


        const {
          error:
            uploadError
        } = await db
          .storage
          .from("posts")
          .upload(
            path,
            recordedAudioBlob,
            {
              contentType:
                recordedAudioBlob.type ||
                "audio/webm",
              upsert: false
            }
          );


        if (uploadError) {

          throw uploadError;

        }


        const {
          data:
            publicData
        } = db
          .storage
          .from("posts")
          .getPublicUrl(
            path
          );


        mediaUrl =
          publicData.publicUrl;

        mediaType =
          "audio";

      }


      /*
       * إضافة المنشور إلى قاعدة البيانات
       *
       * يجب أن يكون عندك جدول posts
       * بهذه الأعمدة:
       *
       * id
       * user_id
       * content
       * media_url
       * media_type
       * created_at
       */

      const {
        error
      } = await db
        .from("posts")
        .insert({
          user_id:
            me.id,

          content:
            text || null,

          media_url:
            mediaUrl,

          media_type:
            mediaType
        });


      if (error) {

        throw error;

      }


      showToast(
        "✅ تم نشر المنشور بنجاح"
      );


      setTimeout(
        () => {

          window.location.href =
            "../index.html";

        },
        1000
      );


    } catch (error) {

      console.error(error);

      showToast(
        "حدث خطأ أثناء النشر: " +
        (
          error.message ||
          "خطأ غير معروف"
        )
      );


      button.disabled = false;

      button.textContent =
        "نشر المنشور";

    }

  }


  /* =========================
     ESCAPE HTML
  ========================= */

  function escapeHtml(text) {

    if (!text)
      return "";

    return String(text)
      .replaceAll(
        "&",
        "&amp;"
      )
      .replaceAll(
        "<",
        "&lt;"
      )
      .replaceAll(
        ">",
        "&gt;"
      )
      .replaceAll(
        '"',
        "&quot;"
      )
      .replaceAll(
        "'",
        "&#039;"
      );

  }


  /* =========================
     NAVIGATION
  ========================= */

  function goHome() {

    window.location.href =
      "../index.html";

  }


  function goFriends() {

    window.location.href =
      "./friends.html";

  }


  function openNotifications() {

    window.location.href =
      "./notifications.html";

  }


  function openProfile() {

    window.location.href =
      "./profile.html";

  }


  function goBack() {

    if (
      history.length > 1
    ) {

      history.back();

    } else {

      goHome();

    }

  }


  /* =========================
     START
  ========================= */

  init();

</script>
